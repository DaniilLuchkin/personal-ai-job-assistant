services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://orbit:${ORBIT_DB_PASSWORD}@db:5432/orbit
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - orbit_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${ORBIT_DB_PASSWORD:?set ORBIT_DB_PASSWORD in .env}
    volumes:
      - orbit_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${ORBIT_HTTP_PORT:-8088}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  orbit_db:
  orbit_data:
  caddy_data:
  caddy_config:
